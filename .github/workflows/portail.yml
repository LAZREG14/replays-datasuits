name: Portail replays

on:
  workflow_dispatch:             # déclenchement manuel uniquement (bouton Run workflow)
    inputs:
      dry_run:
        description: "À blanc : tout lire, ne rien écrire"
        type: boolean
        default: false

concurrency:
  group: portail-replays
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchroniser monday → Supabase
        env:
          MONDAY_TOKEN:         ${{ secrets.MONDAY_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN:              ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python sync_portail.py
